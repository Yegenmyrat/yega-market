<!doctype html>
<html lang="tk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#6b5f55">
<title>Yega Market</title>
<style>
:root{--glass:rgba(75,68,62,.38);--edge:rgba(255,255,255,.38);--gold:#c58e5d;--muted:#e0d7cf}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:#fff;font:15px/1.45 Inter,system-ui,Arial,sans-serif;background:linear-gradient(135deg,#71665d,#b9a99a 50%,#655950) fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
.g{background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(26px) saturate(140%);-webkit-backdrop-filter:blur(26px) saturate(140%);box-shadow:0 14px 35px #30271f30,inset 0 1px 1px #ffffff88}
.wrap{width:min(1200px,94%);margin:0 auto}
#warn{background:#7a2d2d;text-align:center;padding:10px 14px;font-size:13px;display:none}
header{position:sticky;top:8px;z-index:20;margin:8px auto 0;width:min(1200px,94%);display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:22px}
.logo{display:flex;align-items:center;gap:10px}
.mark{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;font-size:17px;letter-spacing:-1px;background:linear-gradient(145deg,#e2d6c9,#76675c);box-shadow:0 5px 16px #0003}
.logo b{font-size:16px;letter-spacing:1px}
.search{flex:1;display:flex;min-width:0}
.search input{width:100%;min-width:0;border:1px solid #fff8;background:#ffffff40;padding:11px 14px;border-radius:16px 0 0 16px;outline:0}
.search input::placeholder{color:#eee6df}
.btn{border:0;cursor:pointer;color:#fff;background:linear-gradient(130deg,#c28b58,#875b37);border-radius:16px;padding:11px 18px;box-shadow:0 8px 18px #0003}
.search .btn{border-radius:0 16px 16px 0;padding:0 16px}
.gb{border:1px solid #fff8;background:#ffffff30;border-radius:14px;padding:10px 12px;cursor:pointer}
.gb:hover{background:#ffffff50}
.actions{display:flex;gap:8px;align-items:center}
select.gb option{color:#222}
.navwrap{position:sticky;top:78px;z-index:15;display:flex;justify-content:center;padding:10px 6px}
.nav{display:flex;gap:4px;padding:6px;border-radius:30px;max-width:100%;overflow:auto}
.nav a{padding:9px 16px;border-radius:25px;font-size:13px;white-space:nowrap;color:#f6f0ea}
.nav a:hover,.nav a.on{background:#ffffffb8;color:#3a332d}
.hero{border-radius:28px;padding:48px 5%;min-height:300px;display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:6px}
.hero h1{font:600 clamp(32px,5.4vw,56px)/1.05 Georgia,serif;margin:0 0 14px;max-width:560px}
.hero p{max-width:470px;color:#eee5dc;margin:0 0 18px}
.heroart{font-size:clamp(80px,14vw,150px);filter:drop-shadow(0 20px 14px #0006)}
.heading{display:flex;justify-content:space-between;align-items:end;margin:34px 2px 14px}
.heading h2{font:600 26px Georgia,serif;margin:0}
.heading small{color:var(--muted)}
.cats{display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.cat{border-radius:20px;padding:15px 6px;text-align:center;cursor:pointer;color:#fff}
.cat span{display:block;font-size:28px;margin-bottom:6px}
.cat b{font-size:12px;font-weight:600}
.cat.on{background:#ffffffb0;color:#3a332d}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 6px}
.filters input,.filters select{border:1px solid #fff8;background:#ffffff30;border-radius:12px;padding:9px 12px;width:auto;max-width:130px}
.filters select{max-width:200px}
/* closet */
.rows{display:grid;gap:36px;padding-top:6px}
.rail{position:relative;display:grid;grid-template-columns:repeat(var(--n),1fr);gap:14px;padding-top:34px}
.rail:before{content:"";position:absolute;left:-1.5%;right:-1.5%;top:9px;height:9px;border-radius:9px;background:linear-gradient(#f4ede5,#8d8176);box-shadow:0 5px 12px #0005}
.item{position:relative;transform-origin:50% -26px}
.item:hover{animation:sw 1.1s ease-in-out}
@keyframes sw{25%{transform:rotate(2.6deg)}75%{transform:rotate(-2deg)}}
.hook{position:absolute;left:50%;top:-26px;width:3px;height:28px;margin-left:-1px;background:#ebe3da}
.hook:before{content:"";position:absolute;left:-7px;top:-9px;width:14px;height:14px;border:3px solid #ebe3da;border-radius:50%}
.card{border-radius:20px;padding:10px;cursor:pointer}
.photo{height:160px;border-radius:14px;background:linear-gradient(145deg,#d4c7ba,#897d73);display:grid;place-items:center;font-size:60px;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover}
.pb{padding:10px 4px 4px}
.pb small{color:var(--muted)}
.pb h3{font-size:14px;margin:6px 0;min-height:36px}
.price{font-weight:800;font-size:18px}
.add{width:100%;margin-top:8px;padding:10px;border-radius:20px}
.empty{padding:30px;border-radius:20px;text-align:center;color:var(--muted)}
@media(prefers-reduced-motion:reduce){.item:hover{animation:none}footer .wave,.blob{animation:none!important}}
/* drawers */
.drawer{position:fixed;inset:0;background:#1d150e66;display:none;justify-content:flex-end;z-index:50}
.drawer.open{display:flex}
.panel{width:min(440px,100%);height:100%;overflow:auto;padding:20px;background:rgba(70,63,57,.82);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);border-left:1px solid var(--edge)}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ph h2{margin:0;font:600 22px Georgia,serif}
.line{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid #fff3}
.qty{display:flex;gap:6px;align-items:center}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid #fff8;background:#ffffff30;cursor:pointer}
.field{width:100%;padding:12px;border:1px solid #fff7;background:#ffffff26;border-radius:14px;margin:5px 0;outline:0}
.field::placeholder{color:#e8dfd7}
.pay{display:grid;gap:6px;margin:8px 0}
.pay label{display:flex;gap:8px;align-items:center;padding:10px 12px;border-radius:14px;border:1px solid #fff6;background:#ffffff1c}
.pay label.off{opacity:.5}
.tot{font-size:20px;font-weight:800;margin:12px 0}
.msg{padding:10px 12px;border-radius:12px;background:#ffffff26;margin:8px 0;font-size:13px}
.msg.err{background:#8a3a3a99}
.tag{font-size:11px;padding:4px 8px;border-radius:20px;background:#ffffff30}
.tag.approved,.tag.done{background:#4f8a5f99}.tag.rejected,.tag.cancelled{background:#8a3a3a99}
.sub{font-size:12px;color:var(--muted)}
.pm{position:fixed;inset:0;z-index:60;display:none;place-items:center;background:#1d150e77;padding:14px}
.pm.open{display:grid}
.pmc{width:min(520px,100%);max-height:92vh;overflow:auto;border-radius:24px;padding:14px;background:rgba(70,63,57,.85)}
.pmc .photo{height:240px}
/* liquid footer */
footer{position:relative;margin-top:70px;padding:80px 20px 28px;text-align:center;overflow:hidden;border-radius:30px 30px 0 0;color:#fff}
footer .wave{position:absolute;top:-1px;left:0;width:200%;height:46px;animation:wv 14s linear infinite;opacity:.9}
@keyframes wv{to{transform:translateX(-50%)}}
.blob{position:absolute;border-radius:50%;filter:blur(36px);opacity:.45;animation:bl 9s ease-in-out infinite alternate}
.b1{width:200px;height:200px;background:#c58e5d;left:8%;bottom:-70px}
.b2{width:160px;height:160px;background:#9fb4bc;right:12%;bottom:-50px;animation-delay:-4s}
@keyframes bl{to{transform:translate(40px,-26px) scale(1.2)}}
footer>*:not(.wave):not(.blob){position:relative}
footer b.big{font:600 22px Georgia,serif}
@media(max-width:760px){
 header{flex-wrap:wrap;gap:8px;padding:10px}
 .logo b{display:none}
 .search{order:3;flex-basis:100%}
 .actions{margin-left:auto}
 .navwrap{top:118px}
 .hero{flex-direction:column;align-items:flex-start;padding:30px 20px;min-height:240px}
 .heroart{display:none}
 .cats{grid-template-columns:repeat(4,1fr)}
 .photo{height:130px}
}
</style>
</head>
<body>
<div id="warn"></div>
<header class="g">
  <a class="logo" href="#top"><span class="mark">|Y|</span><b>YEGA MARKET</b></a>
  <form class="search" id="searchForm"><input id="q" data-ph="search" autocomplete="off"><button class="btn" data-t="go">OK</button></form>
  <div class="actions">
    <select class="gb" id="lang" aria-label="Language"><option value="tk">TM</option><option value="ru">RU</option><option value="en">EN</option></select>
    <button class="gb" data-act="acct" id="acctBtn">👤</button>
    <button class="gb" data-act="cart">🛒 <span id="cc">0</span></button>
  </div>
</header>
<div class="navwrap"><nav class="nav g">
  <a href="#top" class="on" data-t="home"></a><a href="#cats" data-t="categories"></a><a href="#products" data-t="products"></a><a href="#about" data-t="about"></a><a href="#contact" data-t="contact"></a>
</nav></div>

<main class="wrap" id="top">
  <section class="hero g">
    <div><h1 data-t="heroTitle"></h1><p data-t="heroText"></p><button class="btn" data-act="toProducts" data-t="shop"></button></div>
    <div class="heroart">🛍️</div>

  <div class="heading" id="cats"><h2 data-t="categories"></h2></div>
  <section class="cats" id="catGrid"></section>

  <div class="heading" id="products"><h2 data-t="products"></h2><small id="count"></small></div>
  <div class="filters">
    <select class="gb" id="sort"></select>
    <input id="min" type="number" min="0" data-ph="min">
    <input id="max" type="number" min="0" data-ph="max">
  </div>
  <section class="rows" id="rows"></section>

  <section id="about" class="g" style="padding:20px;margin-top:34px;border-radius:22px">
    <b>Yega Market</b>
    <p style="color:#eee5dc;margin:6px 0 0" data-t="aboutText"></p>
  </section>
</main>

<footer class="g" id="contact">
  <svg class="wave" viewBox="0 0 2400 46" preserveAspectRatio="none" aria-hidden="true"><path fill="rgba(255,255,255,.2)" d="M0 46V22C100 2 200 2 300 22S500 42 600 22 800 2 900 22s200 20 300 0V46zM1200 46V22c100-20 200-20 300 0s200 20 300 0 200-20 300 0 200 20 300 0V46z"/></svg>
  <span class="blob b1"></span><span class="blob b2"></span>
  <b class="big">|Y| YEGA MARKET</b>
  <p data-t="footer"></p>
  <div class="sub">© <span id="year"></span> Yega Market</div>
</footer>

<div class="drawer" id="cartD"><aside class="panel"><div class="ph"><h2 data-t="cart"></h2><button class="gb" data-act="close">✕</button></div><div id="cartBody"></div></aside></div>
<div class="drawer" id="acctD"><aside class="panel"><div class="ph"><h2 data-t="account"></h2><button class="gb" data-act="close">✕</button></div><div id="acctBody"></div></aside></div>
<div class="pm" id="pm"><div class="pmc g" id="pmBody"></div></div>

<script type="module">
import {auth,db,configured,CATEGORIES,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,collection,doc,getDoc,setDoc,addDoc,updateDoc,deleteDoc,query,where,onSnapshot,serverTimestamp,esc,safeUrl} from "./fb.js";

const I={

ru:{home:"Главная",categories:"Категории",products:"Товары",about:"О нас",contact:"Контакты",search:"Поиск товара...",go:"OK",heroTitle:"Мировая торговля в одном месте",heroText:"Товары от продавцов, корзина и заказ. Создайте аккаунт и добавьте товар в корзину.",shop:"К товарам",aboutText:"Yega Market — платформа, объединяющая продавцов и покупателей. Сейчас оплата наличными при доставке; онлайн-оплаты пока нет.",footer:"Всё в одном месте.",all:"Все",clothes:"Одежда",electronics:"Электроника",beauty:"Красота",sport:"Спорт",accessories:"Аксессуары",cat_home:"Для дома",empty:"Товаров пока нет. Их можно добавить через аккаунт продавца.",noMatch:"Ничего не найдено.",add:"В корзину",cart:"Корзина",emptyCart:"Корзина пуста.",total:"Итого",checkout:"Заказ",name:"Ваше имя",phone:"Телефон",address:"Адрес",note:"комментарий (необязательно)",cod:"Наличными при доставке",online:"Онлайн-оплата (скоро)",send:"Оформить заказ",orderOk:"Заказ принят. Мы свяжемся с вами.",loginFirst:"Для заказа сначала войдите.",account:"Аккаунт",google:"Войти через Google",email:"E-mail",password:"Пароль (мин. 6)",login:"Войти",register:"Регистрация",iSeller:"Я продавец",logout:"Выйти",becomeSeller:"Стать продавцом",myProducts:"Мои товары",addProduct:"Добавить товар",pName:"Название",pPrice:"Цена (TMT)",pImg:"Ссылка на фото (https://...)",pDesc:"Описание",sellerNote:"Товар появится на сайте после одобрения админом.",myOrders:"Мои заказы",sortNew:"Новые",sortAsc:"Дешевле",sortDesc:"Дороже",min:"От",max:"До",st_pending:"на проверке",st_approved:"одобрен",st_rejected:"отклонён",st_new:"новый",st_confirmed:"подтверждён",st_shipped:"отправлен",st_done:"выполнен",st_cancelled:"отменён",del:"Удалить",noCfg:"Firebase не настроен: заполните firebase-config.js.",fill:"Заполните все поля.",role:"Роль",buyer:"покупатель",seller:"продавец"},
en:{home:"Home",categories:"Categories",products:"Products",about:"About",contact:"Contact",search:"Search products...",go:"OK",heroTitle:"World trade in one place",heroText:"Products from sellers, a cart and orders. Create an account and add items to your cart.",shop:"Browse products",aboutText:"Yega Market connects sellers and buyers. For now payment is cash on delivery; online payment is not available yet.",footer:"Everything in one place.",all:"All",clothes:"Clothing",electronics:"Electronics",beauty:"Beauty",sport:"Sport",accessories:"Accessories",cat_home:"Home",empty:"No products yet. Sellers can add them from their account.",noMatch:"No products found.",add:"Add to cart",cart:"Cart",emptyCart:"Your cart is empty.",total:"Total",checkout:"Order",name:"Your name",phone:"Phone",address:"Address",note:"note (optional)",cod:"Cash on delivery",online:"Online payment (soon)",send:"Place order",orderOk:"Order received. We will contact you.",loginFirst:"Sign in first to place an order.",account:"Account",google:"Sign in with Google",email:"E-mail",password:"Password (min 6)",login:"Sign in",register:"Register",iSeller:"I am a seller",logout:"Sign out",becomeSeller:"Become a seller",myProducts:"My products",addProduct:"Add product",pName:"Product name",pPrice:"Price (TMT)",pImg:"Image URL (https://...)",pDesc:"Description",sellerNote:"Your products appear on the site after admin approval.",myOrders:"My orders",sortNew:"Newest",sortAsc:"Price: low to high",sortDesc:"Price: high to low",min:"Min",max:"Max",st_pending:"pending",st_approved:"approved",st_rejected:"rejected",st_new:"new",st_confirmed:"confirmed",st_shipped:"shipped",st_done:"done",st_cancelled:"cancelled",del:"Delete",noCfg:"Firebase is not set up: fill in firebase-config.js.",fill:"Fill in all fields.",role:"Role",buyer:"buyer",seller:"seller"}
};
I.tk.home_=undefined;
let lang=localStorage.getItem("ym_lang")||"tk";
const t=k=>(I[lang]&&I[lang][k])||I.tk[k]||k;
const catName=id=>id==="home"?t("cat_home"):t(id);
const $=id=>document.getElementById(id);
const fmt=n=>Number(n).toLocaleString("en-US").replace(/,/g," ");

let products=[],cat="all",qtext="",user=null,role="buyer",wantRole=null;
let cart=JSON.parse(localStorage.getItem("ym_cart")||"[]");
let myProducts=[],myOrders=[],unsubs=[];

function applyLang(){
  document.documentElement.lang=lang;$("lang").value=lang;
  document.querySelectorAll("[data-t]").forEach(e=>e.textContent=t(e.dataset.t));
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
  $("sort").innerHTML=[["new","sortNew"],["asc","sortAsc"],["desc","sortDesc"]].map(([v,k])=>`<option value="${v}">${t(k)}</option>`).join("");
  drawCats();draw();drawCart();drawAcct();
}
function drawCats(){
  $("catGrid").innerHTML=[{id:"all",emoji:"🛍️"},...CATEGORIES].map(c=>`<button class="cat g ${cat===c.id?"on":""}" data-act="cat" data-id="${c.id}"><span>${c.emoji}</span><b>${esc(c.id==="all"?t("all"):catName(c.id))}</b></button>`).join("");
}
let lastN=0;
function draw(){
  const min=Number($("min").value)||0,max=Number($("max").value)||Infinity,s=$("sort").value;
  let l=products.filter(p=>(cat==="all"||p.cat===cat)&&p.price>=min&&p.price<=max&&p.name.toLowerCase().includes(qtext));
  if(s==="asc")l.sort((a,b)=>a.price-b.price);else if(s==="desc")l.sort((a,b)=>b.price-a.price);else l.sort((a,b)=>(b.ts||0)-(a.ts||0));
  $("count").textContent=l.length;
  if(!l.length){$("rows").innerHTML=`<div class="empty g">${esc(products.length?t("noMatch"):t("empty"))}</div>`;return}
  const n=innerWidth<760?2:4;lastN=n;let h="";
  for(let i=0;i<l.length;i+=n){
    h+=`<div class="rail" style="--n:${n}">`+l.slice(i,i+n).map(p=>`<article class="item"><span class="hook"></span><div class="card g" data-act="open" data-id="${p.id}"><div class="photo">${photo(p)}</div><div class="pb"><small>${esc(catName(p.cat))}</small><h3>${esc(p.name)}</h3><div class="price">${fmt(p.price)} TMT</div><button class="btn add" data-act="add" data-id="${p.id}">${t("add")} +</button></div></div></article>`).join("")+`</div>`;
  }
  $("rows").innerHTML=h;
}
function photo(p){const u=safeUrl(p.img);const e=(CATEGORIES.find(c=>c.id===p.cat)||{}).emoji||"📦";return u?`<img src="${esc(u)}" alt="" loading="lazy" referrerpolicy="no-referrer">`:e}

function saveCart(){localStorage.setItem("ym_cart",JSON.stringify(cart))}
function lines(){return cart.map(c=>({p:products.find(x=>x.id===c.id),qty:c.qty})).filter(x=>x.p)}
function drawCart(){
  const L=lines(),sum=L.reduce((n,x)=>n+x.p.price*x.qty,0);
  $("cc").textContent=L.reduce((n,x)=>n+x.qty,0);
  if(!L.length){$("cartBody").innerHTML=`<p>${t("emptyCart")}</p>`;return}
  $("cartBody").innerHTML=L.map(x=>`<div class="line"><div>${esc(x.p.name)}<div class="sub">${fmt(x.p.price)} TMT</div></div><div class="qty"><button data-act="dec" data-id="${x.p.id}">−</button>${x.qty}<button data-act="inc" data-id="${x.p.id}">+</button><button data-act="rm" data-id="${x.p.id}">✕</button></div></div>`).join("")+
  `<div class="tot">${t("total")}: ${fmt(sum)} TMT</div>
  <form id="orderForm"><input class="field" id="oName" placeholder="${t("name")}" value="${esc(user?.displayName||"")}" required maxlength="80"><input class="field" id="oPhone" type="tel" placeholder="${t("phone")}" required maxlength="30"><input class="field" id="oAddr" placeholder="${t("address")}" required maxlength="200"><input class="field" id="oNote" placeholder="${t("note")}" maxlength="200">
  <div class="pay"><label><input type="radio" checked> ${t("cod")}</label><label class="off"><input type="radio" disabled> ${t("online")}</label></div>
  <button class="btn" style="width:100%">${t("send")}</button></form><div id="oMsg"></div>`;
}
function setQty(id,d){const c=cart.find(x=>x.id===id);if(!c)return;c.qty+=d;if(c.qty<=0)cart=cart.filter(x=>x.id!==id);saveCart();drawCart()}

function drawAcct(){
  const b=$("acctBody");
  if(!configured){b.innerHTML=`<div class="msg err">${t("noCfg")}</div>`;return}
  if(!user){
    b.innerHTML=`<button class="btn" style="width:100%" data-act="google">${t("google")}</button><hr style="border-color:#fff3;margin:16px 0">
    <form id="authForm"><input class="field" id="aEmail" type="email" placeholder="${t("email")}" required><input class="field" id="aPass" type="password" minlength="6" placeholder="${t("password")}" required>
    <label class="sub"><input type="checkbox" id="aSeller"> ${t("iSeller")}</label>
    <div style="display:flex;gap:8px;margin-top:10px"><button class="btn" style="flex:1" data-mode="login">${t("login")}</button><button class="gb" style="flex:1" data-mode="register">${t("register")}</button></div></form><div id="aMsg"></div>`;
    return;
  }
  let h=`<div class="msg">${esc(user.displayName||user.email)}<div class="sub">${esc(user.email||"")} · ${t("role")}: ${t(role)}</div></div>`;
  if(role==="seller"){
    h+=`<h3>${t("addProduct")}</h3><div class="sub">${t("sellerNote")}</div>
    <form id="prodForm"><input class="field" id="pName" placeholder="${t("pName")}" required maxlength="100"><select class="field" id="pCat">${CATEGORIES.map(c=>`<option value="${c.id}" style="color:#222">${esc(catName(c.id))}</option>`).join("")}</select><input class="field" id="pPrice" type="number" min="0" step="any" placeholder="${t("pPrice")}" required><input class="field" id="pImg" placeholder="${t("pImg")}" maxlength="500"><textarea class="field" id="pDesc" rows="3" placeholder="${t("pDesc")}" maxlength="1000"></textarea><button class="btn" style="width:100%">${t("addProduct")}</button></form><div id="pMsg"></div>
    <h3>${t("myProducts")}</h3>`+(myProducts.map(p=>`<div class="line"><div>${esc(p.name)}<div class="sub">${fmt(p.price)} TMT</div></div><div><span class="tag ${p.status}">${t("st_"+p.status)}</span> <button class="gb" data-act="delmy" data-id="${p.id}">${t("del")}</button></div></div>`).join("")||"<div class='sub'>—</div>");
  }else h+=`<button class="gb" style="width:100%;margin:8px 0" data-act="seller">${t("becomeSeller")}</button>`;
  h+=`<h3>${t("myOrders")}</h3>`+(myOrders.map(o=>`<div class="line"><div>${fmt(o.total)} TMT<div class="sub">${o.items.length} × · ${o.date}</div></div><span class="tag ${o.status}">${t("st_"+o.status)}</span></div>`).join("")||"<div class='sub'>—</div>");
  h+=`<button class="gb" style="width:100%;margin-top:18px" data-act="logout">${t("logout")}</button>`;
  b.innerHTML=h;
}

async function ensureUser(u){
  const r=doc(db,"users",u.uid);const s=await getDoc(r);
  if(!s.exists()){await setDoc(r,{email:u.email||"",name:u.displayName||"",role:wantRole||"buyer",createdAt:serverTimestamp()});role=wantRole||"buyer"}
  else role=s.data().role||"buyer";
  wantRole=null;
}
function listen(u){
  unsubs.forEach(f=>f());unsubs=[];myProducts=[];myOrders=[];
  if(!u)return;
  if(role==="seller")unsubs.push(onSnapshot(query(collection(db,"products"),where("ownerId","==",u.uid)),s=>{myProducts=s.docs.map(d=>({id:d.id,...d.data()}));drawAcct()},()=>{}));
  unsubs.push(onSnapshot(query(collection(db,"orders"),where("userId","==",u.uid)),s=>{myOrders=s.docs.map(d=>{const x=d.data();return{id:d.id,...x,date:x.createdAt?x.createdAt.toDate().toLocaleDateString():""}});drawAcct()},()=>{}));
}

if(configured){
  onSnapshot(query(collection(db,"products"),where("status","==","approved")),s=>{
    products=s.docs.map(d=>{const x=d.data();return{id:d.id,...x,ts:x.createdAt?x.createdAt.toMillis():0}});draw();drawCart();
  },e=>{$("rows").innerHTML=`<div class="empty g">${esc(e.code||e.message)}</div>`});
  onAuthStateChanged(auth,async u=>{
    user=u;role="buyer";
    if(u){try{await ensureUser(u)}catch(e){}}
    listen(u);drawAcct();drawCart();
  });
}else{$("warn").style.display="block";$("warn").textContent=t("noCfg");$("rows").innerHTML=`<div class="empty g">${t("noCfg")}</div>`}

const open=id=>$(id).classList.add("open");
const closeAll=()=>document.querySelectorAll(".drawer,.pm").forEach(x=>x.classList.remove("open"));
const msg=(id,text,err)=>{const e=$(id);if(e)e.innerHTML=`<div class="msg ${err?"err":""}">${esc(text)}</div>`};

document.addEventListener("click",async e=>{
  if(e.target.classList.contains("drawer")||e.target.id==="pm"){closeAll();return}
  const b=e.target.closest("[data-act]");
  if(!b){const m=e.target.closest("[data-mode]");if(m)window._mode=m.dataset.mode;return}
  const a=b.dataset.act,id=b.dataset.id;
  if(a==="cat"){cat=id;drawCats();draw()}
  else if(a==="toProducts")$("products").scrollIntoView({behavior:"smooth"});
  else if(a==="add"){e.stopPropagation();const c=cart.find(x=>x.id===id);c?c.qty++:cart.push({id,qty:1});saveCart();drawCart();b.textContent="✓"}
  else if(a==="open"){const p=products.find(x=>x.id===id);if(!p)return;$("pmBody").innerHTML=`<div class="ph"><span></span><button class="gb" data-act="close">✕</button></div><div class="photo">${photo(p)}</div><div class="pb"><small>${esc(catName(p.cat))}</small><h2 style="font:600 24px Georgia,serif;margin:6px 0">${esc(p.name)}</h2><p>${esc(p.desc||"")}</p><div class="price" style="font-size:24px">${fmt(p.price)} TMT</div><button class="btn add" data-act="add" data-id="${p.id}">${t("add")} +</button></div>`;open("pm")}
  else if(a==="cart"){drawCart();open("cartD")}
  else if(a==="acct"){drawAcct();open("acctD")}
  else if(a==="close")closeAll();
  else if(a==="inc")setQty(id,1);else if(a==="dec")setQty(id,-1);else if(a==="rm")setQty(id,-999);
  else if(a==="google"){try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(x){msg("aMsg",x.code||x.message,1)}}
  else if(a==="logout"){await signOut(auth)}
  else if(a==="seller"){await updateDoc(doc(db,"users",user.uid),{role:"seller"});role="seller";listen(user);drawAcct()}
  else if(a==="delmy"){await deleteDoc(doc(db,"products",id))}
});
document.addEventListener("submit",async e=>{
  e.preventDefault();const f=e.target.id;
  if(f==="authForm"){
    const em=$("aEmail").value.trim(),pw=$("aPass").value;
    try{
      if(window._mode==="register"){wantRole=$("aSeller").checked?"seller":"buyer";await createUserWithEmailAndPassword(auth,em,pw)}
      else await signInWithEmailAndPassword(auth,em,pw);
    }catch(x){wantRole=null;msg("aMsg",x.code||x.message,1)}
  }
  else if(f==="prodForm"){
    const d={name:$("pName").value.trim(),cat:$("pCat").value,price:Number($("pPrice").value),img:safeUrl($("pImg").value.trim()),desc:$("pDesc").value.trim(),ownerId:user.uid,status:"pending",createdAt:serverTimestamp()};
    if(!d.name||!(d.price>=0))return msg("pMsg",t("fill"),1);
    try{await addDoc(collection(db,"products"),d);e.target.reset();msg("pMsg",t("sellerNote"))}catch(x){msg("pMsg",x.code||x.message,1)}
  }
  else if(f==="orderForm"){
    if(!user){closeAll();drawAcct();open("acctD");msg("aMsg",t("loginFirst"),1);return}
    const L=lines();if(!L.length)return;
    const o={userId:user.uid,email:user.email||"",name:$("oName").value.trim(),phone:$("oPhone").value.trim(),address:$("oAddr").value.trim(),note:$("oNote").value.trim(),payment:"cod",items:L.map(x=>({id:x.p.id,name:x.p.name,price:x.p.price,qty:x.qty,sellerId:x.p.ownerId||""})),total:L.reduce((n,x)=>n+x.p.price*x.qty,0),status:"new",createdAt:serverTimestamp()};
    try{await addDoc(collection(db,"orders"),o);cart=[];saveCart();$("cartBody").innerHTML=`<div class="msg">${t("orderOk")}</div>`;$("cc").textContent=0}catch(x){msg("oMsg",x.code||x.message,1)}
  }
  else if(f==="searchForm"){qtext=$("q").value.toLowerCase().trim();cat="all";drawCats();draw();$("products").scrollIntoView({behavior:"smooth"})}
});
$("lang").onchange=e=>{lang=e.target.value;localStorage.setItem("ym_lang",lang);applyLang()};
["sort","min","max"].forEach(i=>$(i).addEventListener("input",draw));
addEventListener("resize",()=>{const n=innerWidth<760?2:4;if(n!==lastN)draw()});
document.querySelectorAll(".nav a").forEach(a=>a.addEventListener("click",()=>{document.querySelectorAll(".nav a").forEach(x=>x.classList.remove("on"));a.classList.add("on")}));
$("year").textContent=new Date().getFullYear();
applyLang();
</script>
</body>
</html>
